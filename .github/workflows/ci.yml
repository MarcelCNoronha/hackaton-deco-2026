name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Type-check server
        working-directory: server
        run: npx tsc --noEmit -p tsconfig.json

      - name: Test server
        working-directory: server
        run: npm test

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type-check web
        working-directory: web
        run: npx tsc --noEmit -p tsconfig.json

      - name: Test web
        working-directory: web
        run: npm test

      - name: Build web
        working-directory: web
        run: npm run build
