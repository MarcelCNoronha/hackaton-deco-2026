name: Deploy Production

# VPS + all 8 secrets configured as of 2026-08-02 — auto-deploy on every push to main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # Mirrors the same fix already needed in the Mundial project's deploy workflow for these
      # same action versions (docker/login-action@v4, docker/build-push-action@v7) — added
      # proactively rather than waiting to hit the same CI failure here.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image metadata
        run: |
          echo "SERVER_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-server" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Prepare deploy bundle
        run: |
          mkdir -p .deploy
          mkdir -p .deploy/scripts
          cp docker-compose.prod.yml .deploy/docker-compose.prod.yml
          cp scripts/prune-production-images.sh .deploy/scripts/prune-production-images.sh
          cat <<'EOF' > .deploy/.env
          ${{ secrets.PRODUCTION_ENV_FILE }}
          EOF
          {
            echo "IMAGE_NAME=${{ env.SERVER_IMAGE }}"
            echo "WEB_IMAGE_NAME=${{ env.WEB_IMAGE }}"
            echo "IMAGE_TAG=${{ env.IMAGE_TAG }}"
          } >> .deploy/.env

      - name: Upload and deploy on VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "$VPS_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SSH_OPTS="-i /tmp/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=15 -o ServerAliveCountMax=6"

          # Hostinger's fail2ban occasionally bans the GitHub-hosted runner's (shared,
          # rotating) IP from a previous unrelated scan — a few short retries cover a real
          # transient network blip; a long hammer-loop wouldn't help against an active ban
          # (the connection never reaches sshd) and would just waste CI minutes.
          upload_ok=0
          for attempt in $(seq 1 3); do
            echo "Upload attempt $attempt..."
            if tar -czf - .deploy/docker-compose.prod.yml .deploy/.env .deploy/scripts/prune-production-images.sh | \
              ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
                "mkdir -p $VPS_DEPLOY_PATH && cd $VPS_DEPLOY_PATH && tar -xzf - --strip-components=1"; then
              echo "Upload succeeded on attempt $attempt"
              upload_ok=1
              break
            fi
            [ "$attempt" -lt 3 ] && { echo "Waiting 20s before retry..."; sleep 20; }
          done
          [ "$upload_ok" -eq 1 ] || { echo "All upload attempts failed"; exit 1; }

          cat > /tmp/remote_deploy.sh << LOCALEOF
          set -eu
          DPATH="$VPS_DEPLOY_PATH"
          GUSER="$GHCR_USERNAME"
          GTOKEN="$GHCR_TOKEN"
          cd "\$DPATH"
          echo "\$GTOKEN" | docker login ghcr.io -u "\$GUSER" --password-stdin
          docker compose -f docker-compose.prod.yml pull --quiet
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          until docker compose -f docker-compose.prod.yml exec -T app wget -qO- http://127.0.0.1:3333/api/health >/dev/null 2>&1; do
            sleep 5
          done
          HEALTH_PORT="\$(docker compose -f docker-compose.prod.yml port web 80 | awk -F: 'END {print \$NF}')"
          curl --retry 10 --retry-delay 5 --retry-all-errors -fsS "http://127.0.0.1:\${HEALTH_PORT}/health"
          chmod +x scripts/prune-production-images.sh
          scripts/prune-production-images.sh --execute --keep-recent 3 --min-age-hours 24 --compose-file docker-compose.prod.yml --env-file .env || \
            echo "Docker image cleanup failed after a healthy deploy; continuing."
          LOCALEOF

          deploy_ok=0
          for attempt in $(seq 1 12); do
            echo "Deploy attempt $attempt..."
            if ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" bash < /tmp/remote_deploy.sh; then
              echo "Deploy succeeded on attempt $attempt"
              deploy_ok=1
              break
            fi
            [ "$attempt" -lt 12 ] && { echo "Waiting 60s before retry..."; sleep 60; }
          done
          [ "$deploy_ok" -eq 1 ] || { echo "All deploy attempts failed"; exit 1; }

          rm -f /tmp/deploy_key /tmp/remote_deploy.sh
