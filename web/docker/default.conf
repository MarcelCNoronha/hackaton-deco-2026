server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /health is nginx's own liveness check (used by the deploy workflow, curled from inside the
    # VPS over plain HTTP — Cloudflare never reaches this port directly); /api/* is everything
    # else, proxied to the Fastify "app" service by its compose DNS name.
    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://app:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

# Real TLS termination at the origin, using a Cloudflare Origin Certificate — required because
# the zone runs SSL/TLS mode "Full (strict)" (Cloudflare only forwards traffic to an origin that
# presents a cert it trusts; a self-signed or absent cert would be rejected outright). The cert/
# key are NOT part of the image — they're a long-lived (15y) secret mounted from the VPS host
# filesystem at deploy time, same reasoning as why `.env` isn't baked into the image either.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://app:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
