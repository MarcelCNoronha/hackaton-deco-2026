name: catalogia-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${IMAGE_NAME}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    logging: *default-logging
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3333/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.6

  worker:
    image: ${IMAGE_NAME}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    logging: *default-logging
    env_file:
      - .env
    environment:
      # only the "app" service migrates on boot — see server/docker-entrypoint.sh
      RUN_MIGRATIONS: "false"
    command: ["node", "dist/queue/worker.js"]
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.5

  web:
    image: ${WEB_IMAGE_NAME}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    logging: *default-logging
    depends_on:
      - app
    ports:
      - "${APP_PORT:-80}:80"
      - "443:443"
    # Cloudflare Origin Certificate (cert.pem + key.pem) — placed directly on the VPS host, never
    # committed or baked into the image; see web/docker/default.conf's 443 server block.
    volumes:
      - /etc/ssl/cloudflare:/etc/nginx/ssl:ro
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.2

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1024m
    mem_reservation: 256m
    cpus: 0.6
    volumes:
      - postgres_data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    logging: *default-logging
    # requirepass: without it, anything on the docker network could read/write cache and
    # queue data. appendonly: without it a restart silently empties the whole BullMQ queue.
    command: valkey-server --requirepass ${VALKEY_PASSWORD} --appendonly yes --appendfsync everysec --maxmemory 200mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.3
    volumes:
      - valkey_data:/data

volumes:
  postgres_data:
  valkey_data:
